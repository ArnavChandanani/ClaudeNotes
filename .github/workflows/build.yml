name: Build APK

# Runs on every push, and can be triggered by hand from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ensures the Android SDK command-line tools are present and licenses accepted,
      # so Gradle can auto-download the compile SDK / build-tools it needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Provides a Gradle executable (8.9 works with Android Gradle Plugin 8.6.1),
      # so we don't need a committed Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
